# ============================================================
# Loki 单节点配置（开发环境用）
# ------------------------------------------------------------
# 适配镜像版本：grafana/loki:2.9.3（见 docker-compose.yml）。
# 该配置使用 v11 + boltdb-shipper + filesystem 的老组合，
# 仅适用于单节点开发/演示；生产环境推荐升级到 tsdb + 对象存储（S3/OSS）。
# ------------------------------------------------------------
# 关键项说明：
#   auth_enabled: false        多租户关闭（X-Scope-OrgID 不再必需）
#   replication_factor: 1      单副本，配合 ring.kvstore=inmemory
#   schema v11 + boltdb-shipper 2.x 时代的稳定 schema，3.x 默认推荐 tsdb
#   allow_structured_metadata: false  关闭结构化元数据（兼容旧 schema）
#   reject_old_samples: false  接受历史样本（开发期回放日志）
#   analytics.reporting_enabled: false 关闭遥测上报
# ============================================================
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

ruler:
  alertmanager_url: http://localhost:9093

limits_config:
  reject_old_samples: false
  allow_structured_metadata: false

analytics:
  reporting_enabled: false
