# ============================================================
# Arthas Tunnel Server —— Java 在线诊断中心
# ------------------------------------------------------------
# 阿里 Arthas 的 Tunnel Server：聚合多个微服务进程的 Arthas 会话，
# 通过 Web UI 远程连接任意业务进程进行在线诊断（watch/trace/jad 等）。
# 镜像来源：阿里云容器镜像服务（wanfei/arthas-tunnel-server:v1）。
# 端口：
#   - 9080 -> 8080  Web 管理页面（HTTP）
#   - 7777 -> 7777  Arthas Agent 主动注册通道（业务进程通过 --tunnel-server 上报）
# ------------------------------------------------------------
# !! 部署前必改 !!
# 1. PARAMS 中的 redis 密码（812840531zhang）为示例，请改为实际 Redis 密码；
#    生产环境建议通过 .env 文件加载。
# 2. 如原注释所述：管理页面没有内置安全拦截，对外开放前务必增加 Nginx 网关 /
#    Basic Auth / IP 白名单等安全措施。
# ============================================================
version: '3'
services:
  arthas-tunnel-server:
    environment:
      # 开放管理页面有风险！管理页面没有安全拦截功能，务必自行增加安全措施
      PARAMS: '--arthas.enable-detail-pages=true --spring.cache.type=redis --arthas.embedded-redis.enabled=true --spring.redis.host=localhost --spring.redis.port=6379 --spring.redis.password=812840531zhang'
    restart: always
    image: registry.cn-shanghai.aliyuncs.com/wanfei/arthas-tunnel-server:v1
    container_name: arthas-tunnel-server
    ports:
      - 9080:8080
      - 7777:7777