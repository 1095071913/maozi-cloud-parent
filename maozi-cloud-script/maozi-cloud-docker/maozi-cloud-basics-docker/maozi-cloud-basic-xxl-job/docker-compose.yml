# ============================================================
# XXL-JOB-Admin 调度中心（独立 Compose，不接入 maozi-cloud-network）
# ------------------------------------------------------------
# 镜像：xuxueli/xxl-job-admin:2.3.0（与本平台 xxl-job-core 版本对齐）
# 数据库：通过 PARAMS 覆写 Spring 配置，指向独立的 XXL-JOB 元数据库
# 端口：宿主机 12000 -> 容器 8080
# ------------------------------------------------------------
# !! 安全提示 !!
# 当前 PARAMS 中硬编码了示例数据库连接（含账号/密码），仅作示例保留。
# 生产环境请改为：
#   1. 通过 .env 文件或外部 environment 加载敏感凭据；
#   2. 使用内网或专用 XXL-JOB 库，避免将凭据提交到代码仓库。
# 宿主机挂载路径 /usr/local/docker/xxl-job/data 为 Linux 默认示例路径，按本机环境调整。
# ============================================================
version: '3.1'
services:
  xxl-job-admin:
    image: xuxueli/xxl-job-admin:2.3.0
    restart: always
    container_name: xxl-job-admin
    environment:
      PARAMS: "--spring.datasource.url=jdbc:mysql://rm-wz9dllf3590kpcran7o.mysql.rds.aliyuncs.com:3306/xxl_job_test?useUnicode=true&characterEncoding=UTF-8&autoReconnect=true&serverTimezone=Asia/Shanghai --spring.datasource.username=jiumao --spring.datasource.password=Jiumao2022^&*"
      TZ: Asia/Shanghai
    volumes:
      - /usr/local/docker/xxl-job/data:/data/applogs
    ports:
      - 12000:8080
