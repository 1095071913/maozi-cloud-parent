# ============================================================
# Promtail 配置 —— 采集 maozi-cloud 共享日志目录并推送至 Loki
# ------------------------------------------------------------
# 关键路径：
#   - 采集路径 /maozi-logs/*/*.log（由 docker-compose 挂载自宿主机共享目录）
#   - 推送目标 http://maozi-cloud-loki:3100/loki/api/v1/push
#   - 采集位置持久化 /data/positions.yaml（容器内，挂载到宿主机 ./maozi-cloud-promtail/data）
# ------------------------------------------------------------
# 解析逻辑：
#   1. 正则匹配 logback-spring.xml 的日志行格式，提取 level/service/environment；
#   2. 将这三项提升为 Loki 标签，便于按服务/级别筛选；
#   3. 使用日志行内的时间作为时间戳（必须指定 location，详见下方注释）。
# ============================================================
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /data/positions.yaml

clients:
  - url: http://maozi-cloud-loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: maozi-cloud-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: maozi-cloud
          __path__: /maozi-logs/*/*.log
    pipeline_stages:
      # 解析 logback 日志行的固定前缀,提取 level/service/environment
      - regex:
          expression: '^\[ (?P<logtime>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}) \]  \[ Level：(?P<level>\w+) \]  \[ TID: (?P<tid>[^\]]*) \]  \[ Service：(?P<service>[^\]]*) \]  \[ Environment：(?P<environment>[^\]]*) \]'
      # 把 level/service/environment 提升为 Loki 标签 (注意: Promtail 不会把它们写进日志正文)
      - labels:
          level:
          service:
          environment:
      # 用日志行里的时间作为 Loki 时间戳 (而非默认的接收时间)
      # location 必填: logback 时间是本地时间 (Asia/Shanghai, UTC+8), 不指定会被当 UTC → 比真实时间晚 8 小时 → Loki 判定 "timestamp too new" 拒收
      - timestamp:
          source: logtime
          format: '2006-01-02 15:04:05'
          location: Asia/Shanghai
