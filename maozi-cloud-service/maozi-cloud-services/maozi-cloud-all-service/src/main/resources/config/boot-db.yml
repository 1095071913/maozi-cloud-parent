# ============================================================
# 数据库 ORM 配置（MyBatis-Plus + MyBatis-Plus-Join + Flyway）
# ============================================================

# MyBatis-Plus 增强版 ORM 配置
mybatis-plus:
  mapper-locations: classpath:com/maozi/*/*/mapper/*.xml   # Mapper XML 扫描路径
  # typeEnumsPackage: com.maozi.${application-project-abbreviation}.*.enums  # 枚举包路径（按需开启）
  configuration:
    map-underscore-to-camel-case: true                     # 下划线转驼峰
    log-impl: com.maozi.db.config.MybatisPlusLog           # 自定义 SQL 日志输出（集成链路日志）
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler  # 枚举类型处理器
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl  # 控制台输出 SQL（调试用）
  global-config:
    refresh: false                                          # 关闭配置热刷新
    banner: false                                           # 关闭 MyBatis-Plus Banner
    db-config:
      db-type: mysql                                        # 数据库类型
      id-type: AUTO                                         # 主键策略：数据库自增
      field-strategy: NOT_NULL                              # 字段插入/更新策略：非空才操作
      column-like: false                                    # 关闭自动 LIKE
      capital-mode: true                                    # 开启大写命名识别
      logic-delete-value: 1                                 # 逻辑删除标记值
      logic-not-delete-value: 0                             # 未删除标记值

# MyBatis-Plus-Join 多表连接查询插件配置
mybatis-plus-join:
  banner: false                                              # 关闭 Banner
  table-alias: main                                          # 默认主表别名（用于排序字段前缀）

# 原生 MyBatis 配置
mybatis:
  configuration:
    cache-enabled: false                                     # 关闭二级缓存（由业务层 Redis 缓存替代）

# Flyway 数据库版本迁移配置
spring:
  flyway:
    enabled: true                                            # 启用 Flyway
    table: system_table_flyway                               # 迁移历史记录表名
    clean-disabled: true                                     # 禁用 clean 命令（防止误删数据）
    out-of-order: true                                       # 允许乱序迁移
    baseline-on-migrate: true                                # 已有库首次迁移时自动打基线
    baseline-version: 0                                      # 基线版本号
    locations: classpath:db                                  # 迁移脚本目录
    encoding: UTF-8                                          # 脚本编码
